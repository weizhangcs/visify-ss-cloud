# ai_services/configs/ai_inference_config.yaml
# 统一管理所有基于Gemini的AI服务的默认模型和推理参数。
#
# [全局参数说明]
# mode: "DEBUG" | "PROD"
#   - 默认为空（不设置），此时以客户端 Payload 中的 mode 为准。
#   - 如果设置为 "DEBUG"，将强制覆盖客户端请求，开启服务端调试日志和文件落盘。

# 人物事实识别服务 (CharacterIdentifier)
character_identifier:
  # FIX: 最终修正为最稳定的、无后缀的 Canonical ID，以最大限度解决 404 错误。
  default_model: "gemini-2.5-flash"
  temperature: 0.1
  batch_size: 150
  # mode: "DEBUG" # 取消注释以强制开启调试
  max_retries: 3

# 解说词生成服务 (NarrationGenerator)
narration_generator:
  # --- 服务定义参数 ---
  lang: "zh"
  model: "gemini-2.5-pro"
  rag_top_k: 100

  # [新增] 语速与时长控制
  speaking_rate: 4.5       # 稍微快一点的语速
  overflow_tolerance: 0.0 # 默认不留白，严格匹配

  # --- 推理参数 ---
  temperature: 0.3         # 对应 schemas.py 中的 temperature (若有) 或代码中使用的 temp

# B-Roll 选择器服务 (BrollSelectorService)
broll_selector_service:
  default_model: "gemini-2.5-pro"
  default_temp: 0.1
  default_lang: "en"

# 字幕合并服务 (SubtitleMerger)
subtitle_merger:
  mode: "DEBUG"
  default_model: "gemini-2.5-flash"
  temperature: 0.1
  batch_size: 200
  max_retries: 3

# 视觉分析服务 (VisualAnalyzer)
visual_analyzer:
  default_model: "gemini-2.5-flash"
  temperature: 0.1
  batch_size: 20
  max_workers: 5
  max_retries: 3

# 场景聚类服务 (SliceRegrouper)
slice_regrouper:
  default_model: "gemini-2.5-flash"
  temperature: 0.1
  max_slices_per_batch: 200
  max_retries: 3
